openapi: 3.1.1
info:
  title: whdt-persistence-api
  version: v0.2.0
paths:
  /hdts:
    post:
      operationId: hdts/post
      summary: Create HDT
      description: Creates a new Human Digital Twin
      requestBody:
        description: The Representation of a Human Digital Twin
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/human-digital-twin'
        required: true
      responses:
        '201':
          description: HumanDigitalTwin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanDigitalTwinDocument'
    get:
      operationId: hdts/get
      summary: List HDTs
      description: Returns all Human Digital Twins
      responses:
        '200':
          description: All Human Digital Twins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HumanDigitalTwinDocument'
  /hdts/{id}:
    put:
      operationId: hdts/{id}/update
      summary: Update HDT
      description: Update a Human Digital Twin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: The updated Human Digital Twin
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/human-digital-twin'
        required: true
      responses:
        '200':
          description: Human Digital Twin updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanDigitalTwinDocument'
        '404':
          description: Human Digital Twin to update not found
    delete:
      operationId: hdts/{id}/remove
      summary: Remove HDT
      description: Remove a Human Digital Twin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Human Digital Twin removed
        '404':
          description: Human Digital Twin to remove not found
    get:
      operationId: hdts/{id}/get
      summary: Get HDT
      description: Get a Human Digital Twin by its ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Human Digital Twin found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanDigitalTwinDocument'
        '404':
          description: Human Digital Twin not found
  /hdts/{id}/models:
    get:
      operationId: hdts/{id}/models
      summary: Get HDT's Models
      description: Get all Models of the specified HDT
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Human Digital Twin Models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDocument'
        '404':
          description: Human Digital Twin not found
  /hdts/{id}/events:
    get:
      operationId: hdts/{id}/events
      summary: Get HDT's [Observations]
      description: Get all Observations of the specified HDT
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Human Digital Twin Observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyObservationDocument'
        '404':
          description: Human Digital Twin or Observations not found
  /hdts/{id}/spec:
    get:
      operationId: hdts/{id}/spec
      summary: Get full HDT spec
      description: Assembles a full HDT spec from hdt, models, and properties collections
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Full HDT spec
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HdtSpecResponse'
        '400':
          description: Missing HDT id
        '500':
          description: HDT or associated data not found
  /hdts/{id}/snapshot:
    get:
      operationId: hdts/{id}/snapshot
      summary: Get HDT snapshot
      description: Returns current value per property — latest observation or initialValue fallback
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Property snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertySnapshotEntry'
        '400':
          description: Missing HDT id
        '500':
          description: HDT or property specs not found
  /hdts/batch:
    put:
      operationId: hdts/batch/update
      summary: Batch update [HDT]
      description: Update a list of Human Digital Twins
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/human-digital-twin'
        required: true
      responses:
        '200':
          description: Human Digital Twins updated
        '500':
          description: Update failed
    post:
      operationId: hdts/batch/insert
      summary: Batch insert [HDT]
      description: Insert a list of Human Digital Twins
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/human-digital-twin'
        required: true
      responses:
        '200':
          description: Human Digital Twins inserted
        '500':
          description: Insertion failed
  /models:
    put:
      operationId: models/upsert
      summary: Create or Update Model
      description: Creates a new Model or updates it if already exists
      requestBody:
        description: The updated Model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model'
        required: true
      responses:
        '200':
          description: Upserted Successfully
        '500':
          description: Failed to upsert Model
    post:
      operationId: models/create
      summary: Create Model
      description: Creates a new model
      requestBody:
        description: The representation of an HDT's Model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model'
        required: true
      responses:
        '201':
          description: Created Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDocument'
    get:
      operationId: models/get
      summary: List Models
      description: Return all Models
      responses:
        '200':
          description: All Models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDocument'
  /models/batch:
    put:
      operationId: models/batch/upsert
      summary: Batch upsert [Model]
      description: Insert or update a list of HDT Models
      requestBody:
        description: The list of HDT Models
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/model'
        required: true
      responses:
        '200':
          description: Upserted Successfully
        '500':
          description: Failed to upsert Models
    post:
      operationId: models/batch/insert
      summary: Batch insert [Model]
      description: Insert a list of HDT Models
      requestBody:
        description: The list of HDT Models
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/model'
        required: true
      responses:
        '201':
          description: Created Successfully
        '500':
          description: Failed to create Models
  /properties:
    get:
      operationId: properties/get
      summary: List Property specs
      description: Return property specs filtered by hdtId and optional modelId
      parameters:
      - name: hdtId
        in: query
        required: true
        schema:
          type: string
      - name: modelId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Property specs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyDocument'
        '400':
          description: Missing hdtId query parameter
  /properties/batch:
    post:
      operationId: properties/batch/upsert
      summary: Batch upsert Property specs
      description: Insert or update a list of Property specs for a given HDT
      parameters:
      - name: hdtId
        in: query
        required: true
        schema:
          type: string
      requestBody:
        description: List of Property specs
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/property'
        required: true
      responses:
        '201':
          description: Property specs upserted successfully
        '400':
          description: Missing hdtId query parameter
        '500':
          description: Failed to upsert property specs
  /observations/batch:
    post:
      operationId: observations/batch/insert
      summary: Batch insert [PropertyObservation]
      description: Batch insert PropertyObservation
      requestBody:
        description: A list of PropertyObservation
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PropertyObservation'
        required: true
      responses:
        '201':
          description: Observations created
        '500':
          description: Error creating observations
  /query/event/values/valuesById:
    post:
      operationId: query/event/values/byId
      summary: Query Observations by Id
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PropertyValuesRequest'
        required: true
      responses:
        '200':
          description: POST /query/event/values/valuesById response 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyObservationDocument'
        '400':
          description: POST /query/event/values/valuesById response 400 if empty request.
  /query/event/values/valuesByName:
    post:
      operationId: query/event/values/byName
      summary: Query Observations by Name
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PropertyValuesRequest'
        required: true
      responses:
        '200':
          description: POST /query/event/values/valuesByName response 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyObservationDocument'
        '400':
          description: POST /query/event/values/valuesByName response 400 if empty request.
  /query/event/values/history:
    post:
      operationId: query/event/values/history
      summary: Query Observation history for a certain HDT
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PropertyValuesRequest'
        required: true
      responses:
        '200':
          description: POST /query/event/values/history response 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyObservationDocument'
        '400':
          description: POST /query/event/values/history response 400 if empty request.
  /query/event/stats:
    post:
      operationId: query/event/stats
      summary: Query Aggregate Stats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyStatsRequest'
        required: true
      responses:
        '200':
          description: POST /query/event/stats response 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyStatsPerHdt'
  /query/event/comparison:
    post:
      operationId: query/event/comparison
      summary: Query Observations by comparisons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertiesByComparisonsRequestDto'
      responses:
        '200':
          description: POST /query/event/comparison response 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertiesByComparisonsAggregateResponse'
components:
  schemas:
    PropertyComparisonDto:
      type: object
      required:
        - propertyName
        - comparison
        - value
      properties:
        propertyName:
          type: string
        comparison:
          type: string
          enum: [ GT, GTE, LT, LTE, EQ ]
        value:
          oneOf:
            - type: number
            - type: string
            - type: boolean
    PropertiesByComparisonsRequestDto:
      type: object
      required:
        - comparisons
      properties:
        comparisons:
          type: array
          items:
            $ref: '#/components/schemas/PropertyComparisonDto'
        modelNames:
          type: array
          items:
            type: string
          nullable: true
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
    mqtt-physical-interface:
      type: object
      title: mqtt-physical-interface
      required:
      - hdtId
      - name
      properties:
        hdtId:
          type: string
        name:
          type: string
        broker:
          type: string
        port:
          type: integer
        config:
          type: object
          additionalProperties:
            type: string
        interfaceType:
          type: string
          enum:
          - MQTT
        id:
          type: string
    physical-interface-impl:
      type: object
      title: physical-interface-impl
      required:
      - interfaceType
      - hdtId
      - name
      properties:
        interfaceType:
          type: string
          enum:
          - MQTT
        hdtId:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
        id:
          type: string
    PhysicalInterface:
      title: io.github.whdt.core.hdt.interfaces.physical.PhysicalInterface
      oneOf:
      - $ref: '#/components/schemas/mqtt-physical-interface'
      - $ref: '#/components/schemas/physical-interface-impl'
    digital-interface-impl:
      type: object
      title: digital-interface-impl
      required:
      - interfaceType
      - hdtId
      - name
      properties:
        interfaceType:
          type: string
          enum:
          - MQTT
          - HTTP
        hdtId:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
        id:
          type: string
    http-digital-interface:
      type: object
      title: http-digital-interface
      required:
      - hdtId
      - name
      properties:
        hdtId:
          type: string
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        config:
          type: object
          additionalProperties:
            type: string
        interfaceType:
          type: string
          enum:
          - HTTP
        id:
          type: string
    mqtt-digital-interface:
      type: object
      title: mqtt-digital-interface
      required:
      - hdtId
      - name
      properties:
        hdtId:
          type: string
        name:
          type: string
        broker:
          type: string
        port:
          type: integer
        config:
          type: object
          additionalProperties:
            type: string
        interfaceType:
          type: string
          enum:
          - MQTT
        id:
          type: string
    DigitalInterface:
      title: io.github.whdt.core.hdt.interfaces.digital.DigitalInterface
      oneOf:
      - $ref: '#/components/schemas/digital-interface-impl'
      - $ref: '#/components/schemas/http-digital-interface'
      - $ref: '#/components/schemas/mqtt-digital-interface'
    Storage:
      type: object
      title: io.github.whdt.core.hdt.storage.Storage
      required:
      - hdtId
      - name
      - storageType
      properties:
        hdtId:
          type: string
        name:
          type: string
        storageType:
          type: string
          enum:
          - IN_MEMORY
          - DB_MONGO
          - DB_POSTGRESQL
        id:
          type: string
    HumanDigitalTwinDocument:
      type: object
      title: io.github.whdt.db.hdt.HumanDigitalTwinDocument
      required:
      - hdtId
      - physicalInterfaces
      - digitalInterfaces
      - storages
      properties:
        hdtId:
          type: string
        physicalInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalInterface'
        digitalInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/DigitalInterface'
        storages:
          type: array
          items:
            $ref: '#/components/schemas/Storage'
        tags:
          type: object
          additionalProperties:
            type: string
    model:
      type: object
      title: model
      required:
      - hdtId
      - name
      - description
      - properties
      properties:
        hdtId:
          type: string
        name:
          type: string
        description:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/property'
        id:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        format:
          type: string
    human-digital-twin:
      type: object
      title: human-digital-twin
      required:
      - hdtId
      properties:
        hdtId:
          type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/model'
        physicalInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalInterface'
        digitalInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/DigitalInterface'
        storages:
          type: array
          items:
            $ref: '#/components/schemas/Storage'
        tags:
          type: object
          additionalProperties:
            type: string
    ModelDocument:
      type: object
      title: io.github.whdt.db.model.ModelDocument
      required:
      - hdtId
      - modelId
      - modelName
      - modelDescription
      properties:
        hdtId:
          type: string
        modelId:
          type: string
        modelName:
          type: string
        modelDescription:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        format:
          type: string
        lastUpdated:
          type: string
          format: date-time
    PropertyDocument:
      type: object
      title: io.github.whdt.db.property.PropertyDocument
      required:
      - hdtId
      - modelId
      - propertyId
      - propertyName
      - description
      - declaredType
      properties:
        hdtId:
          type: string
        modelId:
          type: string
        propertyId:
          type: string
        propertyName:
          type: string
        description:
          type: string
        declaredType:
          type: string
          enum:
          - INT
          - LONG
          - FLOAT
          - DOUBLE
          - STRING
          - BOOLEAN
        initialValue:
          $ref: '#/components/schemas/PropertyValue'
          nullable: true
        tags:
          type: object
          additionalProperties:
            type: string
        coding:
          $ref: '#/components/schemas/Coding'
          nullable: true
        lastUpdated:
          type: string
          format: date-time
    PropertyEventMetadata:
      type: object
      title: io.github.whdt.db.property.PropertyEventMetadata
      required:
      - hdtId
      - modelId
      - modelName
      - propertyName
      - propertyId
      properties:
        hdtId:
          type: string
        modelId:
          type: string
        modelName:
          type: string
        propertyName:
          type: string
        propertyId:
          type: string
    boolean-value:
      type: object
      title: boolean-value
      required:
      - value
      properties:
        value:
          type: boolean
    double-value:
      type: object
      title: double-value
      required:
      - value
      properties:
        value:
          type: number
    empty-value:
      type: object
      title: empty-value
      properties: {}
    float-value:
      type: object
      title: float-value
      required:
      - value
      properties:
        value:
          type: number
    int-value:
      type: object
      title: int-value
      required:
      - value
      properties:
        value:
          type: integer
    long-value:
      type: object
      title: long-value
      required:
      - value
      properties:
        value:
          type: integer
    string-value:
      type: object
      title: string-value
      required:
      - value
      properties:
        value:
          type: string
    PropertyValue:
      title: io.github.whdt.core.hdt.model.property.PropertyValue
      oneOf:
      - $ref: '#/components/schemas/boolean-value'
      - $ref: '#/components/schemas/double-value'
      - $ref: '#/components/schemas/empty-value'
      - $ref: '#/components/schemas/float-value'
      - $ref: '#/components/schemas/int-value'
      - $ref: '#/components/schemas/long-value'
      - $ref: '#/components/schemas/string-value'
    Coding:
      type: object
      title: io.github.whdt.core.hdt.model.property.Coding
      required:
      - system
      - code
      properties:
        system:
          type: string
        code:
          type: string
    PropertyObservationDocument:
      type: object
      title: io.github.whdt.db.property.PropertyObservationDocument
      required:
      - metaField
      - timeField
      - value
      properties:
        metaField:
          $ref: '#/components/schemas/PropertyEventMetadata'
        timeField:
          type: string
          format: date-time
        value:
          $ref: '#/components/schemas/PropertyValue'
    PropertyObservation:
      type: object
      title: io.github.whdt.core.hdt.model.property.PropertyObservation
      required:
      - hdtId
      - modelId
      - propertyId
      - propertyName
      - value
      - timestamp
      properties:
        hdtId:
          type: string
        modelId:
          type: string
        propertyId:
          type: string
        propertyName:
          type: string
        value:
          $ref: '#/components/schemas/PropertyValue'
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
    property:
      type: object
      title: property
      required:
      - modelId
      - name
      - description
      - declaredType
      properties:
        modelId:
          type: string
        name:
          type: string
        description:
          type: string
        declaredType:
          type: string
          enum:
          - INT
          - LONG
          - FLOAT
          - DOUBLE
          - STRING
          - BOOLEAN
        initialValue:
          $ref: '#/components/schemas/PropertyValue'
          nullable: true
        id:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        coding:
          $ref: '#/components/schemas/Coding'
          nullable: true
    PropertySpecEntry:
      type: object
      title: io.github.whdt.db.assembler.PropertySpecEntry
      required:
      - propertyId
      - propertyName
      - description
      - declaredType
      properties:
        propertyId:
          type: string
        propertyName:
          type: string
        description:
          type: string
        declaredType:
          type: string
        initialValue:
          $ref: '#/components/schemas/PropertyValue'
          nullable: true
        tags:
          type: object
          additionalProperties:
            type: string
        coding:
          $ref: '#/components/schemas/Coding'
          nullable: true
    ModelSpecEntry:
      type: object
      title: io.github.whdt.db.assembler.ModelSpecEntry
      required:
      - modelId
      - modelName
      - properties
      properties:
        modelId:
          type: string
        modelName:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/PropertySpecEntry'
        tags:
          type: object
          additionalProperties:
            type: string
        format:
          type: string
    HdtSpecResponse:
      type: object
      title: io.github.whdt.db.assembler.HdtSpecResponse
      required:
      - hdtId
      - physicalInterfaces
      - digitalInterfaces
      - storages
      - models
      - tags
      properties:
        hdtId:
          type: string
        physicalInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalInterface'
        digitalInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/DigitalInterface'
        storages:
          type: array
          items:
            $ref: '#/components/schemas/Storage'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelSpecEntry'
        tags:
          type: object
          additionalProperties:
            type: string
    PropertySnapshotEntry:
      type: object
      title: io.github.whdt.db.assembler.PropertySnapshotEntry
      required:
      - propertyId
      - propertyName
      - source
      properties:
        propertyId:
          type: string
        propertyName:
          type: string
        value:
          $ref: '#/components/schemas/PropertyValue'
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        source:
